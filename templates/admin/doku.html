{% extends "admin/base.html" %}
{% block title %}Admin – {{ title }}{% endblock %}
{% block admin_content %}

<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
  <h4 class="mb-0">
    <i class="bi bi-file-text me-2"></i>{{ title }}
  </h4>
  <div class="d-flex gap-2">
    <a href="/docs/{{ filename }}" download class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-download me-1"></i>Markdown herunterladen
    </a>
    <button class="btn btn-sm btn-outline-secondary" onclick="window.print()">
      <i class="bi bi-printer me-1"></i>Drucken
    </button>
    {% if filename == 'BENUTZERHANDBUCH.md' %}
    <a href="{{ url_for('hilfe') }}" class="btn btn-sm btn-outline-primary" target="_blank">
      <i class="bi bi-box-arrow-up-right me-1"></i>Als Nutzer-Ansicht
    </a>
    {% endif %}
  </div>
</div>

<div class="card shadow-sm">
  <div class="card-body markdown-body">
    {{ content | safe }}
  </div>
</div>

<style>
.markdown-body h1 { font-size: 1.6rem; font-weight: 700; margin: 1.5rem 0 .75rem; padding-bottom: .4rem; border-bottom: 2px solid var(--bl-green); color: var(--bl-green); }
.markdown-body h2 { font-size: 1.25rem; font-weight: 700; margin: 1.5rem 0 .5rem; padding-bottom: .25rem; border-bottom: 1px solid #dee2e6; }
.markdown-body h3 { font-size: 1.05rem; font-weight: 600; margin: 1.1rem 0 .4rem; }
.markdown-body table { width: 100%; border-collapse: collapse; margin: .75rem 0; font-size: .9rem; }
.markdown-body table th { background: #212529; color: #fff; padding: .45rem .75rem; text-align: left; }
.markdown-body table td { padding: .35rem .75rem; border-bottom: 1px solid #dee2e6; vertical-align: top; }
.markdown-body table tr:hover td { background: rgba(0,0,0,.03); }
.markdown-body code { background: #f0f0f0; padding: .15em .45em; border-radius: 4px; font-size: .85em; }
.markdown-body pre { background: #1e1e1e; color: #d4d4d4; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: .75rem 0; }
.markdown-body pre code { background: none; color: inherit; padding: 0; font-size: .85rem; }
.markdown-body blockquote { border-left: 4px solid var(--bl-green); margin: .75rem 0; padding: .5rem 1rem; background: #f8fff8; border-radius: 0 6px 6px 0; }
.markdown-body ul, .markdown-body ol { padding-left: 1.5rem; margin: .5rem 0; }
.markdown-body li { margin-bottom: .3rem; }
.markdown-body hr { border-color: #dee2e6; margin: 2rem 0; }
.markdown-body a { color: var(--bl-green); }
[data-theme="dark"] .markdown-body table th { background: #343a40; }
[data-theme="dark"] .markdown-body table td { border-bottom-color: #444; }
[data-theme="dark"] .markdown-body code { background: #333; }
[data-theme="dark"] .markdown-body blockquote { background: #1a2a1a; }
[data-theme="dark"] .markdown-body h1 { border-bottom-color: #2d8a45; color: #2d8a45; }
@media print {
  .card { box-shadow: none !important; border: none !important; }
}
</style>
{% endblock %}
